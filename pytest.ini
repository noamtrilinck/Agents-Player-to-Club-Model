[pytest]
# Sprint 7.11 -- tiered test-running strategy. See docs/testing_policy.md for the full policy
# (which level to run when, recommended commands, and why each marker exists). This file only
# registers the markers so pytest never emits an "unknown marker" warning; it changes nothing
# about what `pytest` (no args) discovers or runs -- the full suite remains the default and
# authoritative behavior. Markers are an additional selection layer on top of normal discovery,
# never a replacement for it.
markers =
    smoke: small, fast, end-to-end critical-client-journey tests (real app via AppTest) -- app loads, agency/filter/player selection, recommendations render, Top 3->6->9, Additional Match, explanations, nationality flags, league coverage. Run with: pytest -m smoke
    dashboard: any test of dashboard/ (Streamlit app, selection logic, results view, explanations rendering, progressive expansion, nationality flags, league coverage) -- presentation/application layer, not recommendation methodology. Run with: pytest -m dashboard
    stage5: Stage 5 / Style Compatibility tests. Run with: pytest -m stage5
    stage6: Stage 6 / Level & Opportunity (Tier, Reliability, Exception insertion, AO eligibility) tests. Run with: pytest -m stage6
    stage7: any test whose subject lives under Stage 7 (production recommendation data layer AND the dashboard built on top of it) -- broader than `dashboard`, since it also covers Stage 7's non-UI production code (explanation_engine.py, the data-layer build). Run with: pytest -m stage7
    methodology: recommendation/ranking/eligibility METHODOLOGY tests (Stage 1-6 plus Stage 7's non-dashboard production logic) -- changing any of these requires Level 3 full regression, per docs/testing_policy.md. Deliberately excludes dashboard/presentation tests. Run with: pytest -m methodology
